name: Build & Test

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: full

jobs:
  test:
    name: Test tiny-wgs84
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features: ["", "units"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test -p tiny-wgs84 ${{ matrix.features && '--features ' || '' }}${{ matrix.features }}

      - name: Build
        run: cargo build -p tiny-wgs84 ${{ matrix.features && '--features ' || '' }}${{ matrix.features }}

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    container:
      image: xd009642/tarpaulin:develop-nightly
      options: --security-opt seccomp=unconfined
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Generate code coverage
        run: |
          cargo +nightly tarpaulin --all-features --workspace --timeout 120 --out xml
